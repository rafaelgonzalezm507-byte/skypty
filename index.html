  <script src="/_sdk/493c75da57365e07.editing_sdk.js" integrity="sha512-bMyHxLnOu1LL6g5gya2Ge0Bke7bi8xHXRZ+rA+qPKo9sdTsnnZEvmhGWtq7tlLKTo/OSolHMUXwm403pFYM4tg=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");
      menuToggle.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");
        mobileMenu.classList.toggle("hidden", isOpen);
        menuToggle.setAttribute("aria-expanded", String(!isOpen));
      });

      document.querySelectorAll("#mobile-menu a").forEach(link => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
          menuToggle.setAttribute("aria-expanded", "false");
        });
      });

      const flightForm = document.getElementById("flight-form");
      const flightResult = document.getElementById("flight-result");
      const flightError = document.getElementById("flight-error");
      flightForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const origin = document.getElementById("origin").value.trim();
        const destination = document.getElementById("destination").value.trim();
        const departure = document.getElementById("departure").value;
        const returnDate = document.getElementById("return-date").value;
        const passengers = document.getElementById("passengers").value;

        flightError.classList.add("hidden");
        flightResult.classList.add("hidden");

        if (!origin || !destination || !departure || !returnDate) {
          flightError.textContent = "Completa todos los campos para consultar tus opciones de vuelo.";
          flightError.classList.remove("hidden");
          return;
        }
        if (returnDate < departure) {
          flightError.textContent = "La fecha de vuelta debe ser posterior a la fecha de ida.";
          flightError.classList.remove("hidden");
          return;
        }

        const dateFormat = new Intl.DateTimeFormat("es-US", { day: "numeric", month: "short" });
        const fromDate = dateFormat.format(new Date(departure + "T12:00:00"));
        const toDate = dateFormat.format(new Date(returnDate + "T12:00:00"));
        flightResult.textContent = `Buscando las mejores tarifas para ${passengers}: ${origin} → ${destination}, del ${fromDate} al ${toDate}. Un asesor te mostrará las opciones disponibles.`;
        flightResult.classList.remove("hidden");
      });

      document.querySelectorAll(".book-button").forEach(button => {
        button.addEventListener("click", () => {
          document.getElementById("destination").value = button.dataset.destination;
          document.getElementById("vuelos").scrollIntoView({ behavior: "smooth", block: "center" });
          document.getElementById("origin").focus();
        });
      });

      const contactForm = document.getElementById("contact-form");
      const contactStatus = document.getElementById("contact-status");
      const contactSubmit = document.getElementById("contact-submit");
      let canSaveContact = false;

      const dataHandler = {
        onDataChanged() {
          // Este formulario es solo de envío: no muestra consultas almacenadas.
        }
      };

      async function initializeData() {
        const result = await window.dataSdk.init(dataHandler);
        canSaveContact = result.isOk;
        if (!result.isOk) {
          contactStatus.textContent = "No pudimos preparar el envío en este momento. Inténtalo de nuevo.";
          contactStatus.className = "rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700";
        }
      }
      initializeData();

      contactForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!canSaveContact) {
          contactStatus.textContent = "El servicio de contacto aún no está disponible. Inténtalo de nuevo en unos instantes.";
          contactStatus.className = "rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700";
          return;
        }

        const name = document.getElementById("contact-name").value.trim();
        const email = document.getElementById("contact-email-input").value.trim();
        const message = document.getElementById("contact-message").value.trim();
        if (!name || !email || !message) return;

        contactSubmit.disabled = true;
        contactSubmit.classList.add("opacity-70", "cursor-wait");
        contactStatus.textContent = "Enviando tu consulta…";
        contactStatus.className = "rounded-xl bg-sky-50 px-4 py-3 text-sm font-medium text-sky-700";

        const result = await window.dataSdk.create({
          name,
          email,
          message,
          submitted_at: new Date().toISOString()
        });

        if (result.isOk) {
          contactForm.reset();
          contactStatus.textContent = "¡Gracias! Tu consulta fue enviada. Te contactaremos pronto.";
          contactStatus.className = "rounded-xl bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700";
        } else {
          contactStatus.textContent = "No pudimos enviar tu consulta. Revisa tu conexión e inténtalo nuevamente.";
          contactStatus.className = "rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700";
        }
        contactSubmit.disabled = false;
        contactSubmit.classList.remove("opacity-70", "cursor-wait");
      });
    });
  </script>
 </body>
</html>
